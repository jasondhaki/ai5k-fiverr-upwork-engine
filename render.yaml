# Render Blueprint (Infra-as-Code). See README.md's "Deploying to Render"
# section for the one-time setup this assumes (Neon DATABASE_URL, a B2
# bucket, and the env vars below set in Render's dashboard - never here).
#
# Docker, not Render's native Python runtime: kept intentionally even though
# PDF_PARSER=pypdfium2 (the default below) doesn't itself need the system
# libraries the Dockerfile installs - they're there for the PDF_PARSER=docling
# production path (Docling's [standard] extra needs libgl1/libglib2.0-0 for
# opencv, libgomp1 for torch/onnxruntime), which the native Python runtime
# can't install (no apt access) and Docker can. See Dockerfile's comment.
services:
  - type: web
    name: ai5k-profile-intelligence
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    # Runs `alembic upgrade head` before each deploy goes live, so schema
    # changes ship in lockstep with the code that needs them rather than
    # requiring a separate manual migration step against Neon.
    #
    # Deliberately `python -m alembic`, not bare `alembic`: alembic/env.py
    # does `from app.storage.db import ...`, which needs the repo root
    # (/app) on sys.path. `python -m alembic` guarantees that (Python always
    # adds the current working directory for `-m` invocations). A bare
    # `alembic` on Linux runs the installed console-script shim directly,
    # whose sys.path[0] is the shim's OWN directory (e.g. /usr/local/bin),
    # not /app - that raises ModuleNotFoundError: No module named 'app' the
    # moment env.py's import runs. (This only surfaces on Linux - Windows'
    # pip-generated .exe launcher adds the cwd itself, which is why testing
    # locally on this repo's dev machine would not have caught it.)
    preDeployCommand: python -m alembic upgrade head
    envVars:
      - key: DATABASE_URL
        sync: false # Neon connection string - set in Render's dashboard
      - key: STORAGE_BACKEND
        value: b2
      - key: PDF_PARSER
        value: pypdfium2 # 'docling' needs requirements-production.txt installed too - see Dockerfile
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: LLM_PROVIDER
        sync: false # 'anthropic' or 'groq'
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
